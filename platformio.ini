; ============================================================
; ビルド設定
;
; 汎用（ゲーム専用モジュールなし）
;   node          : センサーノード。100 ms ごとに送信（旧 Sender）
;   node_lowpower : node の省電力版。送信時だけ無線を起動し 1 秒ごと＋状態変化時に送る
;   gateway       : 受信機・PC 接続（旧 Receiver）。全モジュールの JSON 変換を持つ
;
; ゲーム別（汎用環境を extends し、ゲーム専用モジュールを有効にする）
;   mug           : ビールジョッキ。node_lowpower + 飲酒検出
;
; 通信なしにする場合は build_flags に -DCOMM_ENABLE=0 を足す
;
; ノード ID を変えて書き込む例:
;   PLATFORMIO_BUILD_FLAGS="-DNODE_ID=2" pio run -e node -t upload
; ============================================================

[platformio]
default_envs = node, gateway

[env]
platform = espressif32@6.5.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5StickCPlus2@^1.0.2
    m5stack/M5Unified@0.1.12
extra_scripts = pre:scripts/fix_dfrobot.py

; ---- 汎用 ----
[env:node]
build_flags = -DROLE_NODE
build_src_filter = +<*> -<app/gateway.cpp>

[env:node_lowpower]
extends = env:node
build_flags = ${env:node.build_flags} -DCOMM_LOW_POWER=1 -DCOMM_TX_PERIOD_MS=1000

[env:gateway]
build_flags = -DROLE_GATEWAY
build_src_filter = +<*> -<app/node.cpp>

; ---- ゲーム別 ----
[env:mug]
extends = env:node_lowpower
build_flags = ${env:node_lowpower.build_flags} -DMODULE_DRINK_ENABLE=1
