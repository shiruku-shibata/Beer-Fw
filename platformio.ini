; ============================================================
; Beer-fw ビルド設定
;   node    : センサーノード（旧 Sender）
;   gateway : 受信機・PC 接続（旧 Receiver）
;   mug     : ビールジョッキ用 node（省電力。送信時だけ無線を起動し 1 秒ごと＋状態変化時に送る）
;             通信なしにする場合は build_flags に -DCOMM_ENABLE=0 を足す
;
; ノード ID を変えて書き込む例:
;   PLATFORMIO_BUILD_FLAGS="-DNODE_ID=2" pio run -e node -t upload
; ============================================================

[platformio]
default_envs = node, gateway

[env]
platform = espressif32@6.5.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5StickCPlus2@^1.0.2
    m5stack/M5Unified@0.1.12
extra_scripts = pre:scripts/fix_dfrobot.py

[env:node]
build_flags = -DROLE_NODE
build_src_filter = +<*> -<app/gateway.cpp>

[env:mug]
build_flags = -DROLE_NODE -DCOMM_LOW_POWER=1 -DCOMM_TX_PERIOD_MS=1000
build_src_filter = +<*> -<app/gateway.cpp>

[env:gateway]
build_flags = -DROLE_GATEWAY
build_src_filter = +<*> -<app/node.cpp>
